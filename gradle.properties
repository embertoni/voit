android.useAndroidX=true
kotlin.code.style=official

# NOTE: `-Duser.home=/projects/sandbox/fakehome` is a sandbox-specific requirement.
# The real home directory (/root) is read-only here, and the Android Gradle Plugin
# (AndroidLocationsBuildService + metrics) writes to ~/.android. Redirecting user.home
# keeps those writes inside the writable /projects/sandbox tree. See docs/decisions.md.
org.gradle.jvmargs=-Xmx2g -Duser.home=/projects/sandbox/fakehome
org.gradle.daemon=false
